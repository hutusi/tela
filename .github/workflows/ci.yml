name: CI

on:
  push:
    branches: [main, feat/**, refactor/**]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, and D1 in workerd
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint and format
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Tests on D1 (workerd)
        run: bun run test:workers

  build-workers:
    # The four Workers, bundled as a deploy would (no credentials needed): a Node-only import or
    # a missing entrypoint fails here, not on deploy day.
    name: Build tela-web, tela-api, tela-jobs and tela-redirect (dry run), and the relay image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Bundle tela-jobs and tela-api
        run: |
          for app in jobs api; do
            (cd "apps/$app" && ../jobs/node_modules/.bin/wrangler deploy --dry-run --outdir "$RUNNER_TEMP/$app")
          done
      # tela-web is built by Vite with the SPA; wrangler then deploys the config the build wrote.
      - name: Build tela-web and bundle it
        run: cd apps/reader && bunx vite build && ./node_modules/.bin/wrangler deploy --dry-run --outdir "$RUNNER_TEMP/reader"
      - name: Bundle tela-redirect
        run: cd apps/reader/redirect && ../node_modules/.bin/wrangler deploy -c wrangler.jsonc --dry-run --outdir "$RUNNER_TEMP/redirect"
      - uses: docker/setup-buildx-action@v4
      - name: Build the relay image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/relay/Dockerfile
          push: false
          tags: tela-relay:ci

  e2e:
    # The built reader, tela-api and tela-jobs in one `wrangler dev` on local D1, R2 and queues.
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # wrangler is a Node CLI.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: cd apps/reader && bunx playwright install --with-deps chromium
      - name: Run e2e
        run: bun run e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            apps/reader/test-results
            .e2e-logs
