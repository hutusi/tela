# Lives at the repository root because Fly uses the config's directory as the build context,
# and the worker image is built from the whole monorepo. Deploy from the root:
#   fly deploy --config fly.worker.toml
app = "tela-worker"
primary_region = "nrt"

[build]
  dockerfile = "apps/worker/Dockerfile"

[env]
  WORKER_ROLES = "scheduler,fetch,extract,translate,assets,claim"
  LOG_LEVEL = "info"
  # Daily ceiling for background (title) translation; reader requests are rate-limited instead.
  LLM_DAILY_BUDGET_TOKENS = "2000000"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[restart]]
  policy = "always"
